name: release

# Keeps a release pull request open; merging it tags vX.Y.Z and creates the
# GitHub release, then publishes that version to npm as
# @trivoallan/ontrack-product. Configuration: release-please-config.json.
on:
  push:
    branches: [main]

# Nothing at workflow level: each job declares what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with GITHUB_TOKEN would trigger no workflow.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Runs only on the push that merged the release pull request.
  publish:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing by OIDC: no token, provenance included.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # npm publish runs the prepare script, which builds dist/ontrack-product-check.js.
      - run: npm ci
      - run: npm publish --provenance --access public
